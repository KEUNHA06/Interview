<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#102d32"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon.png"><title>3급 면접 트레이너 – 65</title><style>
:root{color-scheme:light dark;--bg:#edf3f2;--card:#fff;--ink:#142e33;--muted:#526b70;--accent:#08796c;--line:#d0dfdc}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:17px -apple-system,BlinkMacSystemFont,sans-serif;line-height:1.65}main{max-width:620px;margin:auto;padding: max(18px,env(safe-area-inset-top)) 18px max(24px,env(safe-area-inset-bottom))}h1{font-size:24px;margin:0}h2{font-size:1.35em;line-height:1.5;margin:12px 0}small{color:var(--muted)}section{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;margin:14px 0}button,select{font:inherit;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--card);color:var(--ink);min-height:48px}button{cursor:pointer}button.primary{background:var(--accent);color:white;border:0;font-weight:700}button:disabled{opacity:.4}select{width:100%}.row{display:flex;gap:8px;align-items:center;justify-content:space-between}.row>*{flex:1}.wide{width:100%;margin-top:9px}progress{width:100%;accent-color:var(--accent)}#hint{color:var(--accent);font-weight:700}#answer{white-space:pre-wrap}#clock{font-size:24px;font-variant-numeric:tabular-nums;text-align:right}#stats{font-size:14px}button.selected{outline:3px solid var(--accent)}[hidden]{display:none!important}@media(prefers-color-scheme:dark){:root{--bg:#102124;--card:#1b3034;--ink:#eef8f6;--muted:#b0c8c7;--accent:#38a99a;--line:#385055}button.primary{color:#082724}}
</style></head><body><main><small>BEI · 기술서 기반 65문항</small><h1>3급 면접 트레이너</h1><section><label for="mode">학습 모드</label><select id="mode"><option value="all">전체 랜덤 · 65문항</option><option value="2">제2문항 · 업무실적</option><option value="3">제3문항 · 계획 및 포부</option><option value="4">제4문항 · 팀워크 촉진</option><option value="5">제5문항 · 변화 실행</option><option value="weak">취약 질문 복습</option></select><button id="shuffle" class="wide">새로 섞기</button><div class="row"><label>답변 시간<select id="duration"><option>20</option><option selected>30</option><option>45</option><option>60</option></select></label><label>글자 크기<select id="font"><option value="17">보통</option><option value="20">크게</option><option value="23">매우 크게</option></select></label></div></section><section><div class="row"><small id="count"></small><small id="clock">00:30</small></div><progress id="progress" value="0" max="65"></progress><small id="category"></small><h2 id="question"></h2><div class="row"><button id="timer">타이머 시작</button><button id="speak">질문 읽기</button></div><button id="hintBtn" class="wide">핵심단어 보기</button><p id="hint" hidden></p><button id="answerBtn" class="primary wide">이상적인 답변 보기</button><div id="answerBox" hidden><hr><small>이상적인 답변</small><p id="answer"></p><button id="readAnswer" class="wide">답변 읽기</button><p><small>자기평가</small></p><div class="row" id="ratings"><button data-r="0">다시 연습</button><button data-r="1">조금 부족</button><button data-r="2">숙지 완료</button></div></div><div class="row" style="margin-top:18px"><button id="prev">이전</button><button id="next" class="primary">다음 질문</button></div></section><section><h2>학습 기록</h2><div id="stats"></div><button id="reset" class="wide">학습 기록 초기화</button></section><small>답변은 연습용입니다. 연속 지적자 3명과 처분대상 ZERO의 차이 등 미확정 사실은 면접 전 확인하세요.</small></main><script src="data.js"></script><script>
const $=id=>document.getElementById(id);let storage=true;let s={};try{s=JSON.parse(localStorage.getItem('bei65-v1')||'{}')}catch(e){storage=false}let ratings=s.ratings||{},order=s.order||[],pos=s.pos||0,mode=s.mode||'all',interval=null,left=30;function save(){try{localStorage.setItem('bei65-v1',JSON.stringify({ratings,order,pos,mode,duration:$('duration').value,font:$('font').value}))}catch(e){storage=false}}function pool(){return DATA.map((_,i)=>i).filter(i=>mode==='all'||(mode==='weak'?ratings[i]===0||ratings[i]===1:DATA[i].c.startsWith(mode+'-')))}function shuffle(){order=pool();for(let i=order.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}pos=0;render()}function stop(){clearInterval(interval);interval=null;$('timer').textContent='타이머 시작'}function tick(){ $('clock').textContent='00:'+String(left).padStart(2,'0');if(left===60)$('clock').textContent='01:00'}function render(){stop();left=Number($('duration').value);tick();if(window.speechSynthesis)speechSynthesis.cancel();let d=DATA[order[pos]];$('count').textContent=d?`${pos+1} / ${order.length}`:'0 / 0';$('progress').max=order.length||1;$('progress').value=d?pos+1:0;$('category').textContent=d?d.c:'';$('question').textContent=d?d.q:'복습할 질문이 없습니다.';$('hint').textContent=d?d.k:'';$('answer').textContent=d?d.a:'';$('hint').hidden=true;$('answerBox').hidden=true;for(let id of ['hintBtn','answerBtn','timer','speak','next'])$(id).disabled=!d;$('prev').disabled=!d||pos===0;$('next').textContent=pos===order.length-1?'다시 섞기':'다음 질문';stats();save()}function stats(){let v=Object.values(ratings);$('stats').textContent=`숙지 완료 ${v.filter(x=>x===2).length} / 65 · 조금 부족 ${v.filter(x=>x===1).length} · 다시 연습 ${v.filter(x=>x===0).length} · 미평가 ${65-v.length}`;document.querySelectorAll('[data-r]').forEach(b=>b.classList.toggle('selected',ratings[order[pos]]===Number(b.dataset.r)))}function speak(t){if(!window.speechSynthesis)return alert('이 브라우저는 음성 읽기를 지원하지 않습니다.');speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='ko-KR';u.rate=.9;speechSynthesis.speak(u)}$('mode').value=mode;$('duration').value=s.duration||'30';$('font').value=s.font||'17';document.body.style.fontSize=$('font').value+'px';$('mode').onchange=()=>{mode=$('mode').value;shuffle()};$('shuffle').onclick=shuffle;$('next').onclick=()=>{if(pos+1>=order.length)shuffle();else{pos++;render()}};$('prev').onclick=()=>{if(pos>0){pos--;render()}};$('hintBtn').onclick=()=>{$('hint').hidden=false};$('answerBtn').onclick=()=>{stop();$('hint').hidden=false;$('answerBox').hidden=false};$('duration').onchange=()=>{stop();left=Number($('duration').value);tick();save()};$('font').onchange=()=>{document.body.style.fontSize=$('font').value+'px';save()};$('timer').onclick=()=>{if(interval){stop();return}if(left===0)left=Number($('duration').value);tick();$('timer').textContent='일시정지';interval=setInterval(()=>{left--;tick();if(left<=0){stop();$('clock').textContent='시간 종료'}},1000)};$('speak').onclick=()=>speak(DATA[order[pos]].q);$('readAnswer').onclick=()=>speak(DATA[order[pos]].a);document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{ratings[order[pos]]=Number(b.dataset.r);stats();save()});$('reset').onclick=()=>{if(confirm('학습 기록을 초기화할까요?')){ratings={};shuffle()}};if(!order.length||!order.every(i=>DATA[i])||pos>=order.length)shuffle();else render();if(location.protocol==='https:'&&'serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
